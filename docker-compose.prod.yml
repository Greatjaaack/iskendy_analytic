# Продакшен-конфигурация (самодостаточная, НЕ overlay к docker-compose.yml).
# Отличия от dev:
#   - Caddy терминирует HTTPS (авто-сертификат Let's Encrypt по домену из $DOMAIN);
#   - backend и frontend наружу НЕ публикуются (expose, не ports) — доступны только
#     через Caddy по 443, пароль дашборда больше не летит открытым текстом;
#   - том backend-data общий с dev-конфигом (имя проекта = имя папки), данные не теряются.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
# Нужен заполненный .env с DOMAIN=<ваш домен> (см. .env.example).
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # БД в volume, а не в слое контейнера (переопределяет DATABASE_URL из .env).
      DATABASE_URL: sqlite:////data/iskendi.db
    volumes:
      - backend-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    # Машина тесная (957 МБ), а бэкенд — главный едок: ~372 МБ плюс пики, когда
    # Playwright поднимает Chromium на перелогин в iiko (раз в ~20 минут).
    # Без лимита при нехватке памяти глобальный OOM-killer выбирает жертву по
    # своей эвристике, а не по виновности: 06.08.2026 он убил uvicorn аналитики,
    # но с тем же успехом мог убить сайт-табло или общий Caddy — тогда легло бы
    # всё. Контейнер с явным лимитом получает меньший oom_score и, если уж
    # переберёт память, умирает сам и один. 512 МБ — с запасом к 372; если
    # начнёт падать по OOM на перелогине, поднять до 768m.
    mem_limit: 512m
    # Ротации логов не было вообще: json-file растёт до конца диска, а он занят
    # на 84%. Три файла по 10 МБ — потолок 30 МБ на контейнер.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    # nginx с готовой статикой ест 2-3 МБ; лимит тут не про экономию, а про то,
    # чтобы при утечке жертву выбирал не глобальный OOM-killer по своей эвристике.
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Реверс-прокси с автоматическим HTTPS. Проксирует всё на frontend:80,
  # а тот уже раздаёт SPA и проксирует /api на backend (см. frontend/nginx.conf).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?нужно задать DOMAIN в .env}
    volumes:
      # Монтируем КАТАЛОГ, а не файл. При монтировании одиночного файла bind-mount
      # держится за его inode, а `git pull` пишет новый файл и переименовывает —
      # inode меняется, и контейнер продолжает читать старую версию. 24.08 на этом
      # обожглись: `caddy reload` отработал «успешно» на устаревшем конфиге, и
      # разошлись md5 хоста и контейнера. С каталогом reload честный.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    # Caddy держит ~20 МБ; запас на перевыпуск сертификатов. Лимит тут важнее, чем
    # у остальных: контейнер общий для трёх продуктов, и если его выберет жертвой
    # глобальный OOM-killer, наружу пропадут сразу все домены.
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
  caddy-data:
  caddy-config:
