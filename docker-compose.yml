services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # БД пишем в volume, а не в слой контейнера (переопределяет DATABASE_URL из .env).
      # Четыре слэша = абсолютный путь /data/iskendi.db.
      DATABASE_URL: sqlite:////data/iskendi.db
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Состояние видно в `docker ps`: unhealthy — значит бэкенд не отвечает на /api/health.
    # Сам Docker по этому статусу контейнер НЕ перезапускает (это делает сторож
    # `guard.sh` на хосте, раз в 5 минут) — здесь польза в диагностике: при разборе
    # «почему на табло нет заказов» сразу видно, жив ли бэкенд аналитики.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      # Старт небыстрый: поднимается планировщик и синхронно синкается выручка за 31 день.
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
